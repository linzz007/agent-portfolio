<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1320" viewBox="0 0 1900 1320">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#263246"/>
    </marker>
    <style>
      .bg { fill: #f5f7fb; }
      .title { font: 700 44px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #152033; }
      .subtitle { font: 500 20px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #617087; }
      .section-title { font: 700 24px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #1f2a3d; }
      .section-note { font: 500 16px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #65758a; }
      .box-title { font: 700 21px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #172033; }
      .box-text { font: 500 15px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #45566c; }
      .small { font: 600 13px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #637287; }
      .lane { fill: #ffffff; stroke: #d9e2ef; stroke-width: 1.5; rx: 20; }
      .shared { fill: #eef8f4; stroke: #8bd8bc; }
      .chat { fill: #f0f6ff; stroke: #96bdff; }
      .report { fill: #f5f0ff; stroke: #bda7f3; }
      .subagent { fill: #fff4e6; stroke: #efbf73; }
      .govern { fill: #fff0f3; stroke: #f2a2b8; }
      .result { fill: #edfaff; stroke: #8bd3f4; }
      .line { stroke: #263246; stroke-width: 2.1; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #7d8ba1; stroke-width: 1.8; stroke-dasharray: 7 7; fill: none; marker-end: url(#arrow); }
      .tag { fill: #172033; opacity: 0.08; }
      .tag-text { font: 700 14px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect class="bg" width="1900" height="1320"/>

  <text class="title" x="80" y="76">Runtime 三种入口分流图</text>
  <text class="subtitle" x="82" y="114">同一个 AgentRuntime，根据输入分流到普通聊天、/report 固定 Workflow、动态 Subagent</text>

  <!-- Shared entry -->
  <rect class="lane shared" x="70" y="150" width="1760" height="245"/>
  <text class="section-title" x="105" y="195">公共入口：所有请求先进入 Runtime</text>
  <text class="section-note" x="105" y="224">这里回答“谁接住用户输入”：不是前端直接调用业务函数，而是统一进入 AgentRuntime 与 TurnCoordinator。</text>

  <rect class="lane" x="135" y="265" width="255" height="78" rx="14"/>
  <text class="box-title" x="168" y="294">User Query</text>
  <text class="box-text" x="168" y="319">用户输入 / 对话框消息</text>

  <rect class="lane shared" x="480" y="250" width="330" height="108" rx="14"/>
  <text class="box-title" x="515" y="280">AgentRuntime.run_turn</text>
  <text class="box-text" x="515" y="306">统一执行入口</text>
  <text class="box-text" x="515" y="330">接收 session_id / message / mode</text>

  <rect class="lane shared" x="895" y="250" width="340" height="108" rx="14"/>
  <text class="box-title" x="930" y="280">TurnCoordinator.run_turn</text>
  <text class="box-text" x="930" y="306">创建 run，协调单轮生命周期</text>
  <text class="box-text" x="930" y="330">保存消息、状态、artifact</text>

  <rect class="lane shared" x="1320" y="250" width="350" height="108" rx="14"/>
  <text class="box-title" x="1355" y="280">_parse_slash_command</text>
  <text class="box-text" x="1355" y="306">识别 /report /wiki /chat</text>
  <text class="box-text" x="1355" y="330">无 slash 则交给 resolver</text>

  <path class="line" d="M390 304 H480"/>
  <path class="line" d="M810 304 H895"/>
  <path class="line" d="M1235 304 H1320"/>

  <!-- Branch labels -->
  <rect class="tag" x="185" y="420" width="250" height="34" rx="17"/>
  <text class="tag-text" x="210" y="443">路径 A：普通聊天</text>

  <rect class="tag" x="795" y="420" width="260" height="34" rx="17"/>
  <text class="tag-text" x="820" y="443">路径 B：/report 报告</text>

  <rect class="tag" x="1370" y="420" width="300" height="34" rx="17"/>
  <text class="tag-text" x="1395" y="443">路径 C：动态 Subagent</text>

  <!-- Chat lane -->
  <rect class="lane chat" x="70" y="475" width="540" height="655"/>
  <text class="section-title" x="105" y="520">路径 A：普通聊天 general_chat</text>
  <text class="section-note" x="105" y="548">没有 slash command 时，默认进入普通对话能力。</text>

  <rect class="lane chat" x="135" y="590" width="395" height="74" rx="14"/>
  <text class="box-title" x="168" y="619">SkillRegistry 默认选择</text>
  <text class="box-text" x="168" y="644">skill_id = general_chat</text>

  <rect class="lane chat" x="135" y="710" width="395" height="74" rx="14"/>
  <text class="box-title" x="168" y="739">_execute_general_chat</text>
  <text class="box-text" x="168" y="764">ExecutorRegistry 找到普通聊天 executor</text>

  <rect class="lane chat" x="135" y="830" width="395" height="74" rx="14"/>
  <text class="box-title" x="168" y="859">_run_general_chat</text>
  <text class="box-text" x="168" y="884">构造 prompt，调用模型，生成回答</text>

  <rect class="lane result" x="135" y="985" width="395" height="86" rx="14"/>
  <text class="box-title" x="168" y="1015">普通对话结果</text>
  <text class="box-text" x="168" y="1041">answer / citations / trace</text>
  <text class="box-text" x="168" y="1063">必要时包含 subagent 观察结果</text>

  <path class="line" d="M1495 358 V455 H333 V590"/>
  <path class="line" d="M333 664 V710"/>
  <path class="line" d="M333 784 V830"/>
  <path class="line" d="M333 904 V985"/>

  <!-- Report lane -->
  <rect class="lane report" x="680" y="475" width="555" height="655"/>
  <text class="section-title" x="715" y="520">路径 B：/report 外部变化报告</text>
  <text class="section-note" x="715" y="548">显式 /report 进入 external_impact_report，再由外层 AgentLoop 调用固定 workflow。</text>

  <rect class="lane report" x="745" y="590" width="425" height="74" rx="14"/>
  <text class="box-title" x="778" y="619">skill_id = external_impact_report</text>
  <text class="box-text" x="778" y="644">由 slash command 显式选择</text>

  <rect class="lane report" x="745" y="710" width="425" height="74" rx="14"/>
  <text class="box-title" x="778" y="739">_execute_external_impact_report</text>
  <text class="box-text" x="778" y="764">进入报告型 skill executor</text>

  <rect class="lane report" x="745" y="830" width="425" height="74" rx="14"/>
  <text class="box-title" x="778" y="859">_run_external_impact_report</text>
  <text class="box-text" x="778" y="884">创建 report_orchestrator 外层 AgentLoop</text>

  <rect class="lane report" x="745" y="950" width="425" height="74" rx="14"/>
  <text class="box-title" x="778" y="979">report_workflow.run</text>
  <text class="box-text" x="778" y="1004">skill-scoped tool，最多调用一次</text>

  <rect class="lane report" x="745" y="1060" width="425" height="86" rx="14"/>
  <text class="box-title" x="778" y="1090">_run_external_impact_workflow</text>
  <text class="box-text" x="778" y="1116">route: news / policy / research / source_inventory</text>
  <text class="box-text" x="778" y="1138">执行固定 workflow，生成报告产物</text>

  <path class="line" d="M1495 358 V455 H958 V590"/>
  <path class="line" d="M958 664 V710"/>
  <path class="line" d="M958 784 V830"/>
  <path class="line" d="M958 904 V950"/>
  <path class="line" d="M958 1024 V1060"/>

  <!-- Subagent lane -->
  <rect class="lane subagent" x="1305" y="475" width="525" height="655"/>
  <text class="section-title" x="1340" y="520">路径 C：动态 Subagent</text>
  <text class="section-note" x="1340" y="548">不是正式 /subagent slash command，而是在普通聊天中由 Runtime 按需触发。</text>

  <rect class="lane subagent" x="1370" y="590" width="395" height="74" rx="14"/>
  <text class="box-title" x="1403" y="619">_run_dynamic_subagents_for_chat</text>
  <text class="box-text" x="1403" y="644">判断是否需要分析 / 质疑 / 验证</text>

  <rect class="lane subagent" x="1370" y="710" width="395" height="74" rx="14"/>
  <text class="box-title" x="1403" y="739">subagent_plan</text>
  <text class="box-text" x="1403" y="764">规划 role / task / trigger / reason</text>

  <rect class="lane subagent" x="1370" y="830" width="395" height="74" rx="14"/>
  <text class="box-title" x="1403" y="859">subagent_delegate</text>
  <text class="box-text" x="1403" y="884">SubagentRunner 隔离上下文执行</text>

  <rect class="lane subagent" x="1370" y="950" width="395" height="74" rx="14"/>
  <text class="box-title" x="1403" y="979">结果回填上下文</text>
  <text class="box-text" x="1403" y="1004">subagent_results 注入主回答上下文</text>

  <rect class="lane result" x="1370" y="1060" width="395" height="86" rx="14"/>
  <text class="box-title" x="1403" y="1090">主 Agent 最终回答</text>
  <text class="box-text" x="1403" y="1116">结合原始上下文 + 子智能体观察</text>
  <text class="box-text" x="1403" y="1138">保存 answer 与 trace</text>

  <path class="dash" d="M530 867 H1230 V627 H1370"/>
  <path class="line" d="M1568 664 V710"/>
  <path class="line" d="M1568 784 V830"/>
  <path class="line" d="M1568 904 V950"/>
  <path class="line" d="M1568 1024 V1060"/>
  <path class="dash" d="M1370 993 H610 V1028 H530"/>

  <!-- Shared context / trace footer -->
  <rect class="lane govern" x="70" y="1180" width="1760" height="95"/>
  <text class="section-title" x="105" y="1220">所有路径共享的 Harness 能力</text>
  <text class="section-note" x="105" y="1250">ContextManifest / Memory / Wiki / ToolGateway / PermissionEngine / Gate / AgentStep Trace / Artifact 都由 Runtime 统一托管。</text>

  <path class="dash" d="M333 1071 V1180"/>
  <path class="dash" d="M958 1146 V1180"/>
  <path class="dash" d="M1568 1146 V1180"/>
</svg>
